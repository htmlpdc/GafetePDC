<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hagamos un gafete</title>
<style>
  :root {
    --pdc-blue:#102a83;
    --pdc-cyan:#4bb9df;
    --panel:#f2f5ff;
    --yellow:#ffc400;
    --orange:#ff9800;
    --text:#102a83;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Arial Rounded MT Bold","Trebuchet MS",Arial,sans-serif;background:#fff;color:var(--text)}
  .topbar{height:114px;background:var(--pdc-blue);display:flex;align-items:center;justify-content:center;gap:44px;padding:12px 24px}
  .topbar img{width:142px;height:auto;display:block}
  .topbar h1{margin:0;color:#fff;font-size:34px;line-height:1;font-weight:800;letter-spacing:.1px}
  .workspace{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:520px 1fr;gap:60px;padding:0 28px 48px}
  .controls{background:var(--panel);min-height:595px;padding:48px 44px 32px;border-radius:0 0 30px 30px;box-shadow:0 9px 18px rgba(16,42,131,.14)}
  .upload-row{display:flex;align-items:center;gap:9px;margin-bottom:4px}
  .folder{width:58px;height:58px;object-fit:contain;filter:drop-shadow(0 3px 3px rgba(0,0,0,.18))}
  .upload-btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:14px;border:0;border-radius:13px;padding:12px 24px;background:linear-gradient(#ffd429,#ff9814);color:var(--pdc-blue);font:800 21px/1 inherit;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 2px 4px rgba(0,0,0,.12)}
  .upload-btn:hover{filter:brightness(1.03)}
  .upload-btn input{position:absolute;inset:0;opacity:0;cursor:pointer}
  .upload-arrow{font-size:26px;line-height:1;transform:translateY(-1px)}
  .hint{margin:0 0 36px 75px;font-family:Arial,sans-serif;font-size:15px;line-height:1.2;max-width:310px}
  .field{margin-bottom:17px}
  label{display:block;font-size:17px;font-weight:900;margin:0 0 3px 13px}
  input[type=text]{width:100%;height:43px;border:1px solid #aaa;border-radius:7px;background:#fff;padding:7px 12px;font:18px Arial,sans-serif;color:#182b6f;outline:none}
  input[type=text]:focus{border-color:#4b74dc;box-shadow:0 0 0 3px rgba(75,116,220,.15)}
  .short{width:56% !important}
  .adjustments{margin:4px 0 18px;padding:12px 14px;background:rgba(255,255,255,.65);border-radius:12px;display:none}
  .adjustments.visible{display:block}
  .adjustments .row{display:grid;grid-template-columns:72px 1fr auto;gap:10px;align-items:center;font:14px Arial,sans-serif;margin:7px 0}
  input[type=range]{width:100%}
  .reset{border:0;background:transparent;color:var(--pdc-blue);font-weight:700;cursor:pointer;padding:4px}
  .download{border:0;border-radius:10px;padding:12px 29px;background:linear-gradient(#4a79eb,#1647c8);color:#fff;font:800 19px/1 inherit;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 3px 6px rgba(16,42,131,.18)}
  .preview-wrap{padding-top:40px;display:flex;justify-content:center;align-items:flex-start}
  .badge-frame{width:430px;border:1px solid #bbb;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.05)}
  #badgeCanvas{width:100%;height:auto;display:block;touch-action:none;cursor:grab}
  #badgeCanvas.dragging{cursor:grabbing}
  .status{min-height:20px;margin-top:9px;font:13px Arial,sans-serif;color:#4a5b98}
  @media(max-width:900px){
    .topbar{height:auto;min-height:100px;gap:22px}.topbar img{width:112px}.topbar h1{font-size:27px}
    .workspace{grid-template-columns:1fr;gap:24px;padding:0 16px 34px}
    .controls{max-width:560px;width:100%;margin:0 auto}
    .preview-wrap{padding-top:0}
  }
  @media(max-width:540px){
    .topbar{justify-content:flex-start;padding-left:18px}.topbar h1{font-size:24px}
    .controls{padding:34px 22px 28px}
    .upload-btn{font-size:17px;padding:11px 13px}.folder{width:48px;height:48px}
    .hint{margin-left:57px}
    .badge-frame{width:min(100%,430px)}
  }
</style>
</head>

Ws4W+y8LAPZLaAWAe+51eZ/rflC+HyifQ7cTAO75//2IhYq5nJ9AAAAAAElFTkSuQmCC';
  const photoInput=document.getElementById('photoInput');
  const zoomInput=document.getElementById('zoom');
  const adjustments=document.getElementById('adjustments');
  const status=document.getElementById('photoStatus');
  let photo=null, baseScale=1, zoom=1, offsetX=0, offsetY=0;
  let dragging=false, lastX=0, lastY=0;
  const circle={x:350,y:431,r:184};

  function titleCase(value){
    return value.toLocaleLowerCase('es').replace(/(^|[\s\-'])([a-záéíóúüñ])/g,(m,p,c)=>p+c.toLocaleUpperCase('es'));
  }
  function fitFont(text,maxWidth,start,min,weight='700'){
    let size=start;
    do{ctx.font=`${weight} ${size}px "Arial Rounded MT Bold","Trebuchet MS",Arial,sans-serif`; if(ctx.measureText(text).width<=maxWidth) break; size-=1;}while(size>min);
    return size;
  }
  function drawCentered(text,y,maxWidth,start,min,weight='700'){
    const size=fitFont(text,maxWidth,start,min,weight); ctx.font=`${weight} ${size}px "Arial Rounded MT Bold","Trebuchet MS",Arial,sans-serif`; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillStyle=BLUE; ctx.fillText(text,350,y);
  }
  function drawLogo(){
    if(!logo.complete) return;
    const targetW=310, ratio=logo.naturalHeight/logo.naturalWidth;
    ctx.drawImage(logo,(W-targetW)/2,27,targetW,targetW*ratio);
  }
  function drawPhoto(){
    ctx.save(); ctx.beginPath(); ctx.arc(circle.x,circle.y,circle.r,0,Math.PI*2); ctx.clip();
    if(photo){
      const s=baseScale*zoom, dw=photo.naturalWidth*s, dh=photo.naturalHeight*s;
      ctx.drawImage(photo,circle.x-dw/2+offsetX,circle.y-dh/2+offsetY,dw,dh);
    } else { ctx.fillStyle='#00ff00'; ctx.fillRect(circle.x-circle.r,circle.y-circle.r,circle.r*2,circle.r*2); }
    ctx.restore();
  }
  function drawSmile(){
    if(!smile.complete || !smile.naturalWidth) return;
    const targetW=430;
    const targetH=targetW*(smile.naturalHeight/smile.naturalWidth);
    ctx.drawImage(smile,(W-targetW)/2,550,targetW,targetH);
  }
  function drawFooter(){
    ctx.fillStyle=BLUE; ctx.beginPath(); ctx.moveTo(0,888); ctx.quadraticCurveTo(350,1034,700,888); ctx.lineTo(700,1078); ctx.lineTo(0,1078); ctx.closePath(); ctx.fill();
    const font='700 42px "Arial Rounded MT Bold","Trebuchet MS",Arial,sans-serif';
    const parts=[
      {text:'#Yo',color:'#ffffff'},
      {text:'Transformo',color:'#84c5e8'},
      {text:'Vidas',color:'#ffffff'}
    ];
    ctx.font=font; ctx.textBaseline='middle'; ctx.textAlign='left';
    const total=parts.reduce((sum,part)=>sum+ctx.measureText(part.text).width,0);
    let x=(W-total)/2;
    for(const part of parts){ctx.fillStyle=part.color;ctx.fillText(part.text,x,1019);x+=ctx.measureText(part.text).width;}
  }
  function render(){
    ctx.clearRect(0,0,W,H); ctx.fillStyle='#fff'; ctx.fillRect(0,0,W,H);
    drawLogo(); drawPhoto(); drawSmile();
    const n=titleCase(inputs.names.value.trim())||'María Eliza';
    const s=titleCase(inputs.surnames.value.trim())||'López Carranza';
    const c=inputs.code.value.trim()||'56421';
    const id=inputs.identification.value.trim()||'DPI:1234-5678-0101';
    drawCentered(n,738,560,42,27,'800');
    drawCentered(s,785,560,42,27,'800');
    drawCentered('Código: '+c,838,560,29,21,'400');
    drawCentered(id,893,610,27,18,'400');
    drawFooter();
  }
  function resetPhotoPosition(){
    if(!photo) return;
    baseScale=Math.max((circle.r*2)/photo.naturalWidth,(circle.r*2)/photo.naturalHeight);
    zoom=1; zoomInput.value='1'; offsetX=0; offsetY=0; render();
  }
  function keepPhotoCovered(){
    if(!photo) return;
    const dw=photo.naturalWidth*baseScale*zoom, dh=photo.naturalHeight*baseScale*zoom;
    const maxX=Math.max(0,(dw-circle.r*2)/2), maxY=Math.max(0,(dh-circle.r*2)/2);
    offsetX=Math.max(-maxX,Math.min(maxX,offsetX)); offsetY=Math.max(-maxY,Math.min(maxY,offsetY));
  }
  async function autoCenterFace(){
    if(!photo) return;
    resetPhotoPosition();
    if(!('FaceDetector' in window)){status.textContent='Centrado automático aplicado. Puedes arrastrar y ajustar el zoom si lo necesitas.'; return;}
    try{
      const detector=new FaceDetector({fastMode:true,maxDetectedFaces:1});
      const faces=await detector.detect(photo);
      if(faces.length){
        const b=faces[0].boundingBox;
        const faceX=b.x+b.width/2, faceY=b.y+b.height/2;
        const desiredY=circle.y-20;
        offsetX=(photo.naturalWidth/2-faceX)*baseScale*zoom;
        offsetY=(photo.naturalHeight/2-faceY)*baseScale*zoom+(desiredY-circle.y);
        keepPhotoCovered(); status.textContent='Rostro detectado y centrado. Puedes afinarlo arrastrando la fotografía.';
      } else status.textContent='No se detectó un rostro. Se aplicó centrado automático; puedes ajustarlo manualmente.';
    }catch(e){status.textContent='Centrado automático aplicado. Puedes arrastrar y ajustar el zoom.';}
    render();
  }
  Object.values(inputs).forEach(el=>el.addEventListener('input',()=>{
    if(el===inputs.code) el.value=el.value.replace(/\D/g,'');
    render();
  }));
  inputs.names.addEventListener('blur',()=>{inputs.names.value=titleCase(inputs.names.value.trim());render();});
  inputs.surnames.addEventListener('blur',()=>{inputs.surnames.value=titleCase(inputs.surnames.value.trim());render();});
  photoInput.addEventListener('change',()=>{
    const file=photoInput.files&&photoInput.files[0]; if(!file) return;
    if(!/^image\/(jpeg|png|webp)$/.test(file.type)){alert('Selecciona una fotografía JPG, PNG o WEBP.');return;}
    const url=URL.createObjectURL(file), img=new Image();
    img.onload=async()=>{ if(photo&&photo._url) URL.revokeObjectURL(photo._url); img._url=url; photo=img; adjustments.classList.add('visible'); await autoCenterFace(); };
    img.onerror=()=>{URL.revokeObjectURL(url);alert('No fue posible abrir la fotografía.');}; img.src=url;
  });
  zoomInput.addEventListener('input',()=>{zoom=parseFloat(zoomInput.value);keepPhotoCovered();render();});
  document.getElementById('resetPhoto').addEventListener('click',autoCenterFace);
  function pointerPos(e){const r=canvas.getBoundingClientRect();return {x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height};}
  canvas.addEventListener('pointerdown',e=>{if(!photo)return;const p=pointerPos(e);if(Math.hypot(p.x-circle.x,p.y-circle.y)>circle.r)return;dragging=true;lastX=p.x;lastY=p.y;canvas.classList.add('dragging');canvas.setPointerCapture(e.pointerId);});
  canvas.addEventListener('pointermove',e=>{if(!dragging)return;const p=pointerPos(e);offsetX+=p.x-lastX;offsetY+=p.y-lastY;lastX=p.x;lastY=p.y;keepPhotoCovered();render();});
  canvas.addEventListener('pointerup',e=>{dragging=false;canvas.classList.remove('dragging');try{canvas.releasePointerCapture(e.pointerId)}catch(_){}});
  canvas.addEventListener('pointercancel',()=>{dragging=false;canvas.classList.remove('dragging')});
  document.getElementById('downloadBtn').addEventListener('click',()=>{
    if(!photo){alert('Primero debes subir una fotografía.');return;}
    if(!inputs.names.value.trim()||!inputs.surnames.value.trim()||!inputs.code.value.trim()||!inputs.identification.value.trim()){alert('Completa nombres, apellidos, código y no. de identificación.');return;}
    render(); canvas.toBlob(blob=>{
      if(!blob){alert('No fue posible generar el gafete.');return;}
      const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
      const safe=(titleCase(inputs.names.value.trim())+' '+titleCase(inputs.surnames.value.trim())).replace(/[^a-záéíóúüñ0-9]+/gi,'_');
      a.download='Gafete_'+safe+'.jpg'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),1200);
    },'image/jpeg',0.96);
  });
  logo.onload=render; smile.onload=render; render();
})();
</script>
</body>
</html>
